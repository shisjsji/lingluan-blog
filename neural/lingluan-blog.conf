server {
    listen 80;
    listen [::]:80;
    server_name lingluandf.online www.lingluandf.online 47.238.233.55;
    root /var/www/lingluan-blog;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name lingluandf.online www.lingluandf.online;

    ssl_certificate     /etc/letsencrypt/live/lingluandf.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingluandf.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/lingluan-blog;
    index index.html;
    charset utf-8;

    location /admin/ {
        proxy_pass http://127.0.0.1:3001/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # 神经元 API：SSE 需要关闭缓冲
    location /neural-api/ {
        proxy_pass http://127.0.0.1:3002/neural-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/lingluan-blog.access.log;
    error_log /var/log/nginx/lingluan-blog.error.log;
}