name: Agent access setup

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 47.238.233.55 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Authorize agent key and diagnose
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts root@47.238.233.55 '
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPyewGWQqaWvAYlFG62fdwlg9OyGgxgg2zO1Dy18OYyy local-agents-root-access" >> /root/.ssh/authorized_keys
            sort -u /root/.ssh/authorized_keys -o /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            echo "=== authorized keys ==="; wc -l < /root/.ssh/authorized_keys; cut -d@ -f2 /root/.ssh/authorized_keys
            echo "=== ufw ==="; ufw status | head -12
            echo "=== fail2ban ==="; systemctl is-active fail2ban 2>/dev/null || echo none
            echo "=== iptables INPUT ==="; iptables -S INPUT 2>/dev/null | head -12
            echo "=== nginx ==="; systemctl is-active nginx
            echo "=== admin ==="; systemctl is-active blog-admin
            echo "=== 本机 80 自测 ==="; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1/
          '