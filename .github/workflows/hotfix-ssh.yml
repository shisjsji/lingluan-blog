name: SSH port hotfix

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 47.238.233.55 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Enable port 2222 and report state
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts root@47.238.233.55 '
            ufw allow 2222/tcp
            grep -q "^Port 2222" /etc/ssh/sshd_config || echo "Port 2222" >> /etc/ssh/sshd_config
            systemctl restart ssh
            echo "=== listening ==="; ss -tlnp | grep sshd
            echo "=== ufw ==="; ufw status | grep 2222
            echo "=== node ==="; command -v node && node -v || echo NO_NODE
            echo "=== disk ==="; df -h / | tail -1
          '