name: Run remote setup script

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 47.238.233.55 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Execute setup script
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts root@47.238.233.55 'bash /tmp/setup-https.sh 2>&1'